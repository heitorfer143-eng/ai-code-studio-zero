<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CodeZero AI Code Studio V10.2</title>
  <link rel="stylesheet" href="style.css?v=10.2.0">
</head>
<body>
  <header>
    <button id="chatToggle" class="ghost">☰ Chats</button>
    <b>⚡ CodeZero <small>V10.2</small></b>
    <span id="status">☁️ Railway</span>
    <button id="theme">☀/☾</button>
    <button id="uploadImage">📤 Asset</button><button id="new3D">🎮 Novo Godot</button><button id="exportGodot">📦 Baixar Godot ZIP</button><button id="resetProject">↻ Resetar</button><button id="run">▶ Ver projeto</button>
  </header>

  <div class="shell">
    <aside id="chatSidebar">
      <div class="sidebarHead">
        <strong>Conversas</strong>
        <button id="newChat">＋ Novo</button>
      </div>
      <div id="chatList"></div><div class="assetSection"><div class="assetHead"><strong>Assets visuais</strong></div><div id="assetList"></div></div>
    </aside>

    <main>
      <section class="chat">
        <div id="messages"></div>
        <div id="attachments"></div>
        <div class="composer">
          <input id="attachmentInput" type="file" hidden multiple accept="image/*,.pdf,.txt,.md,.markdown,.json,.jsonc,.js,.mjs,.cjs,.ts,.tsx,.jsx,.html,.css,.scss,.xml,.yml,.yaml,.csv,.log,.ini,.cfg,.conf,.env,.gd,.tscn,.tres,.gdshader,.godot,.py,.java,.c,.cc,.cpp,.h,.hpp,.cs,.go,.rs,.php,.rb,.sh,.sql">
          <button id="attachBtn" type="button" title="Anexar imagem, PDF ou arquivo">📎</button>
          <textarea id="prompt" placeholder="Anexe uma imagem/PDF/arquivo e peça para explicar, analisar ou corrigir..."></textarea>
          <button id="send">Enviar</button>
        </div>
      </section>

      <section class="workspace">
        <nav id="tabs"></nav>
        <div class="code">
          <pre id="lines">1</pre>
          <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div class="output">
          <iframe id="preview" sandbox="allow-scripts"></iframe>
          <pre id="console"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="drawerShade"></div>
  <script type="module" src="app.js?v=10.2.0"></script>
</body>
</html>
