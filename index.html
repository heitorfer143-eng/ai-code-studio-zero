<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CodeZero AI Code Studio V8.5</title>
  <link rel="stylesheet" href="style.css?v=8.5.0">
</head>
<body>
  <header>
    <button id="chatToggle" class="ghost">☰ Chats</button>
    <b>⚡ CodeZero <small>V8.5</small></b>
    <span id="status">☁️ Railway</span>
    <button id="theme">☀/☾</button>
    <button id="imageTool">🎨 Imagem</button><button id="new3D">🧊 Novo 3D</button><button id="resetProject">↻ Resetar</button><button id="run">▶ Executar</button>
  </header>

  <div class="shell">
    <aside id="chatSidebar">
      <div class="sidebarHead">
        <strong>Conversas</strong>
        <button id="newChat">＋ Novo</button>
      </div>
      <div id="chatList"></div>
    </aside>

    <main>
      <section class="chat">
        <div id="messages"></div>
        <div class="composer">
          <textarea id="prompt" placeholder="Converse, peça código ou peça para pesquisar na web..."></textarea>
          <button id="send">Enviar</button>
        </div>
      </section>

      <section class="workspace">
        <nav id="tabs"></nav>
        <div class="code">
          <pre id="lines">1</pre>
          <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div class="output">
          <iframe id="preview" sandbox="allow-scripts"></iframe>
          <pre id="console"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="drawerShade"></div>
  <script type="module" src="app.js?v=8.5.0"></script>
</body>
</html>
